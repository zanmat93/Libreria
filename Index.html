<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Mia Libreria</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Dexie.js (IndexedDB wrapper) -->
<script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
<!-- HTML5 QR / Barcode Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>
<!-- FontAwesome per le icone -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

<!-- Header -->
<header class="bg-indigo-600 text-white p-4 sticky top-0 z-30 shadow-md">
<div class="max-w-md mx-auto flex justify-between items-center">
<h1 class="text-xl font-bold"><i class="fa-solid fa-book-bookmark mr-2"></i>La Mia Libreria</h1>
<button onclick="openManualModal()" class="text-sm bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg">
<i class="fa-solid fa-plus mr-1"></i>Manuale
</button>
</div>
</header>

<!-- Filtri di Stato -->
<nav class="bg-white shadow-sm border-b sticky top-[60px] z-20">
<div class="max-w-md mx-auto flex justify-around text-sm font-medium text-slate-600">
<button onclick="setFilter('all')" id="tab-all" class="py-3 px-2 border-b-2 border-indigo-600 text-indigo-600 font-bold">Tutti</button>
<button onclick="setFilter('Da Leggere')" id="tab-to-read" class="py-3 px-2 border-b-2 border-transparent">Da Leggere</button>
<button onclick="setFilter('In Lettura')" id="tab-reading" class="py-3 px-2 border-b-2 border-transparent">In Lettura</button>
<button onclick="setFilter('Letto')" id="tab-read" class="py-3 px-2 border-b-2 border-transparent">Letti</button>
</div>
</nav>

<!-- Griglia Libri -->
<main class="max-w-md mx-auto p-4">
<div id="books-grid" class="grid grid-cols-2 gap-4"></div>
<div id="empty-state" class="text-center py-12 text-slate-400 hidden">
<i class="fa-solid fa-book-open text-5xl mb-3"></i>
<p>Nessun libro trovato in questa sezione.</p>
</div>
</main>

<!-- Tasto Fluttuante Scanner (FAB) -->
<button onclick="startScanner()" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl z-40 hover:bg-indigo-700 transition-transform active:scale-95">
<i class="fa-solid fa-barcode"></i>
</button>

<!-- MODALE SCANNER -->
<div id="scanner-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col justify-center items-center p-4">
<div class="bg-white rounded-xl w-full max-w-sm overflow-hidden p-4 relative">
<h2 class="text-lg font-bold mb-2 text-center">Inquadra il Codice a Barre</h2>
<div id="reader" class="w-full"></div>
<button onclick="stopScanner()" class="mt-4 w-full bg-slate-200 text-slate-800 py-2 rounded-lg font-semibold">Annulla</button>
</div>
</div>

<!-- MODALE DETTAGLIO / INSERIMENTO -->
<div id="book-modal" class="fixed inset-0 bg-black/50 z-50 hidden justify-center items-end sm:items-center p-0 sm:p-4">
<div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 relative">
<button onclick="closeBookModal()" class="absolute top-4 right-4 text-slate-400 text-xl"><i class="fa-solid fa-xmark"></i></button>

<form id="book-form" onsubmit="saveBook(event)">
<input type="hidden" id="book-id">
<div class="flex gap-4 mb-4">
<img id="modal-cover" src="https://via.placeholder.com/128x192?text=Copertina" class="w-24 h-36 object-cover rounded shadow">
<div class="flex-1">
<input type="text" id="modal-title" placeholder="Titolo" required class="w-full font-bold border-b mb-2 p-1 focus:outline-none focus:border-indigo-600">
<input type="text" id="modal-author" placeholder="Autore/i" required class="w-full text-sm text-slate-600 border-b mb-2 p-1 focus:outline-none">
<input type="text" id="modal-genre" placeholder="Genere" class="w-full text-xs text-slate-500 border-b mb-2 p-1">
<input type="text" id="modal-year" placeholder="Anno" class="w-full text-xs text-slate-500 border-b p-1">
</div>
</div>

<div class="mb-4">
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">URL Copertina</label>
<input type="url" id="modal-cover-url" class="w-full text-xs border rounded p-2" onchange="document.getElementById('modal-cover').src=this.value">
</div>

<div class="mb-4">
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Stato Lettura</label>
<select id="modal-status" class="w-full border rounded-lg p-2 bg-slate-50">
<option value="Da Leggere">Da Leggere</option>
<option value="In Lettura">In Lettura</option>
<option value="Letto">Letto</option>
</select>
</div>

<div class="mb-4">
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Valutazione</label>
<select id="modal-rating" class="w-full border rounded-lg p-2 bg-slate-50">
<option value="0">Nessuna stella</option>
<option value="1">⭐ (1/5)</option>
<option value="2">⭐⭐ (2/5)</option>
<option value="3">⭐⭐⭐ (3/5)</option>
<option value="4">⭐⭐⭐⭐ (4/5)</option>
<option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
</select>
</div>

<div class="mb-6">
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Recensione / Note</label>
<textarea id="modal-review" rows="3" class="w-full border rounded-lg p-2 text-sm" placeholder="Scrivi un pensiero su questo libro..."></textarea>
</div>

<div class="flex gap-2">
<button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700">Salva</button>
<button type="button" id="delete-btn" onclick="deleteBook()" class="bg-red-100 text-red-600 px-4 rounded-lg hidden"><i class="fa-solid fa-trash"></i></button>
</div>
</form>
</div>
</div>

<script>
// --- 1. SETUP DATABASE LOCALE (Dexie.js) ---
const db = new Dexie('LibreriaDB');
db.version(1).stores({
books: '++id, isbn, title, author, status, rating, created_at'
});

let html5QrcodeScanner = null;
let currentFilter = 'all';

// --- 2. RENDER LIBRERIA ---
async function loadBooks() {
const grid = document.getElementById('books-grid');
const emptyState = document.getElementById('empty-state');
grid.innerHTML = '';

let collection = db.books;
if (currentFilter !== 'all') {
collection = collection.where('status').equals(currentFilter);
}

const books = await collection.toArray();

if (books.length === 0) {
emptyState.classList.remove('hidden');
return;
}
emptyState.classList.add('hidden');

books.reverse().forEach(book => {
const stars = book.rating > 0 ? '⭐'.repeat(book.rating) : '';
const card = document.createElement('div');
card.className = 'bg-white rounded-xl shadow-sm border overflow-hidden cursor-pointer flex flex-col justify-between';
card.onclick = () => openEditModal(book.id);

card.innerHTML = &lt;div&gt; &lt;img src="${book.coverUrl || 'https://via.placeholder.com/128x192?text=No+Cover'}" class="w-full h-44 object-cover">
<div class="p-2">
<span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 mb-1 inline-block">${book.status}&lt;/span&gt; &lt;h3 class="font-bold text-sm text-slate-800 line-clamp-1"&gt;${book.title}</h3>
<p class="text-xs text-slate-500 line-clamp-1">${book.author}&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="p-2 pt-0 text-xs"&gt;${stars}</div>
`;
grid.appendChild(card);
});
}

// --- 3. LOGICA SCANNER & GOOGLE BOOKS API ---
function startScanner() {
document.getElementById('scanner-modal').classList.remove('hidden');
document.getElementById('scanner-modal').classList.add('flex');

html5QrcodeScanner = new Html5Qrcode("reader");
html5QrcodeScanner.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: { width: 250, height: 150 } },
onScanSuccess
);
}

function stopScanner() {
if (html5QrcodeScanner) {
html5QrcodeScanner.stop().then(() => {
document.getElementById('scanner-modal').classList.add('hidden');
document.getElementById('scanner-modal').classList.remove('flex');
});
}
}

async function onScanSuccess(decodedText) {
stopScanner();
await fetchBookFromISBN(decodedText);
}

async function fetchBookFromISBN(isbn) {
try {
const response = await fetch(https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
const data = await response.json();

if (data.totalItems > 0) {
const info = data.items[0].volumeInfo;
openModalWithData({
isbn: isbn,
title: info.title || '',
author: info.authors ? info.authors.join(', ') : '',
genre: info.categories ? info.categories[0] : '',
year: info.publishedDate ? info.publishedDate.substring(0, 4) : '',
coverUrl: info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail).replace('http:', 'https:') : '',
status: 'Da Leggere',
rating: 0,
review: ''
});
} else {
alert('Libro non trovato su Google Books. Compila i dati manualmente.');
openModalWithData({ isbn: isbn });
}
} catch (err) {
alert('Errore nel recupero dati dal network.');
}
}

// --- 4. GESTIONE MODALE ED EDITING ---
function openModalWithData(book = {}) {
document.getElementById('book-id').value = book.id || '';
document.getElementById('modal-title').value = book.title || '';
document.getElementById('modal-author').value = book.author || '';
document.getElementById('modal-genre').value = book.genre || '';
document.getElementById('modal-year').value = book.year || '';
document.getElementById('modal-cover-url').value = book.coverUrl || '';
document.getElementById('modal-cover').src = book.coverUrl || 'https://via.placeholder.com/128x192?text=Copertina';
document.getElementById('modal-status').value = book.status || 'Da Leggere';
document.getElementById('modal-rating').value = book.rating || 0;
document.getElementById('modal-review').value = book.review || '';

const deleteBtn = document.getElementById('delete-btn');
if (book.id) {
deleteBtn.classList.remove('hidden');
} else {
deleteBtn.classList.add('hidden');
}

document.getElementById('book-modal').classList.remove('hidden');
document.getElementById('book-modal').classList.add('flex');
}

function openManualModal() { openModalWithData(); }
function closeBookModal() {
document.getElementById('book-modal').classList.add('hidden');
document.getElementById('book-modal').classList.remove('flex');
}

async function openEditModal(id) {
const book = await db.books.get(id);
if (book) openModalWithData(book);
}

async function saveBook(e) {
e.preventDefault();
const id = document.getElementById('book-id').value;
const data = {
title: document.getElementById('modal-title').value,
author: document.getElementById('modal-author').value,
genre: document.getElementById('modal-genre').value,
year: document.getElementById('modal-year').value,
coverUrl: document.getElementById('modal-cover-url').value,
status: document.getElementById('modal-status').value,
rating: parseInt(document.getElementById('modal-rating').value),
review: document.getElementById('modal-review').value,
created_at: new Date()
};

if (id) {
await db.books.update(parseInt(id), data);
} else {
await db.books.add(data);
}

closeBookModal();
loadBooks();
}

async function deleteBook() {
const id = document.getElementById('book-id').value;
if (id && confirm('Vuoi davvero eliminare questo libro dal tuo catalogo?')) {
await db.books.delete(parseInt(id));
closeBookModal();
loadBooks();
}
}

// --- 5. FILTRI TAB ---
function setFilter(filter) {
currentFilter = filter;
document.querySelectorAll('nav button').forEach(btn => {
btn.classList.remove('border-indigo-600', 'text-indigo-600', 'font-bold');
btn.classList.add('border-transparent');
});

const tabMap = { 'all': 'tab-all', 'Da Leggere': 'tab-to-read', 'In Lettura': 'tab-reading', 'Letto': 'tab-read' };
const activeTab = document.getElementById(tabMap[filter]);
activeTab.classList.add('border-indigo-600', 'text-indigo-600', 'font-bold');

loadBooks();
}

// Caricamento iniziale
loadBooks();
</script>
</body>
</html>
