<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Mia Libreria</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Dexie.js (IndexedDB Wrapper) -->
<script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

<!-- HTML5 QR / Barcode Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
font-family: 'Inter', sans-serif;
-webkit-tap-highlight-color: transparent;
}
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 min-h-screen select-none">

<!-- HEADER APPLICAZIONE -->
<header class="bg-indigo-600 text-white p-4 sticky top-0 z-30 shadow-md">
<div class="max-w-md mx-auto flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-9 h-9 bg-indigo-500 rounded-lg flex items-center justify-center text-white shadow-inner">
<i class="fa-solid fa-book-bookmark text-lg"></i>
</div>
<div>
<h1 class="text-lg font-bold leading-tight">La Mia Libreria</h1>
<p id="stats-counter" class="text-[11px] text-indigo-200">Caricamento...</p>
</div>
</div>
<div class="flex gap-2">
<button onclick="exportData()" title="Esporta Backup" class="w-8 h-8 rounded-full bg-indigo-500 hover:bg-indigo-700 flex items-center justify-center text-sm transition">
<i class="fa-solid fa-download"></i>
</button>
<button onclick="document.getElementById('import-file').click()" title="Importa Backup" class="w-8 h-8 rounded-full bg-indigo-500 hover:bg-indigo-700 flex items-center justify-center text-sm transition">
<i class="fa-solid fa-upload"></i>
</button>
<input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
<button onclick="openManualModal()" class="bg-indigo-500 hover:bg-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm transition active:scale-95">
<i class="fa-solid fa-plus"></i> Manuale
</button>
</div>
</div>
</header>

<!-- BARRA DI RICERCA & FILTRI TAB -->
<div class="bg-white border-b sticky top-[61px] z-20 shadow-sm">
<div class="max-w-md mx-auto p-3 pb-2">
<!-- Search Input -->
<div class="relative mb-2">
<i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
<input type="text" id="search-input" oninput="debounceSearch()" placeholder="Cerca per titolo, autore o genere..." class="w-full bg-slate-100 pl-9 pr-8 py-1.5 text-xs rounded-lg border-0 focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
<button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
<i class="fa-solid fa-xmark"></i>
</button>
</div>

<!-- Navigation Tabs -->
<nav class="flex justify-between text-xs font-medium text-slate-500 overflow-x-auto no-scrollbar border-t border-slate-100 pt-1">
<button onclick="setFilter('all')" id="tab-all" class="py-2 px-3 border-b-2 border-indigo-600 text-indigo-600 font-semibold transition whitespace-nowrap">Tutti</button>
<button onclick="setFilter('Da Leggere')" id="tab-to-read" class="py-2 px-3 border-b-2 border-transparent transition whitespace-nowrap">Da Leggere</button>
<button onclick="setFilter('In Lettura')" id="tab-reading" class="py-2 px-3 border-b-2 border-transparent transition whitespace-nowrap">In Lettura</button>
<button onclick="setFilter('Letto')" id="tab-read" class="py-2 px-3 border-b-2 border-transparent transition whitespace-nowrap">Letti</button>
</nav>
</div>
</div>

<!-- CONTENITORE PRINCIPALE (GRIGLIA LIBRI) -->
<main class="max-w-md mx-auto p-4">
<div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3.5"></div>

<!-- Empty State -->
<div id="empty-state" class="text-center py-16 text-slate-400 hidden">
<div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
<i class="fa-solid fa-book-open text-2xl text-slate-300"></i>
</div>
<p class="font-medium text-slate-600 text-sm">Nessun libro trovato</p>
<p class="text-xs text-slate-400 mt-1 max-w-[200px] mx-auto">Scansiona un codice a barre o inseriscilo manualmente.</p>
</div>
</main>

<!-- PULSANTE FLUTTUANTE SCANNER (FAB) -->
<div class="fixed bottom-6 right-6 z-40">
<button onclick="startScanner()" class="bg-indigo-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-xl hover:bg-indigo-700 transition active:scale-90 focus:outline-none ring-4 ring-indigo-100">
<i class="fa-solid fa-barcode"></i>
</button>
</div>

<!-- MODALE SCANNER FOTOCAMERA -->
<div id="scanner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col justify-center items-center p-4 transition-opacity">
<div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden p-5 shadow-2xl relative">
<div class="flex justify-between items-center mb-3">
<h2 class="text-base font-bold text-slate-800"><i class="fa-solid fa-camera text-indigo-600 mr-2"></i>Scansiona Barcode</h2>
<button onclick="stopScanner()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
</div>

<div id="reader" class="w-full bg-slate-900 rounded-xl overflow-hidden min-h-[220px]"></div>
<p class="text-[11px] text-center text-slate-400 mt-3">Inquadra il codice a barre sul retro del libro</p>

<button onclick="stopScanner()" class="mt-4 w-full bg-slate-100 text-slate-700 py-2.5 rounded-xl font-medium text-xs hover:bg-slate-200 transition">Annulla</button>
</div>
</div>

<!-- MODALE DETTAGLIO / INSERIMENTO -->
<div id="book-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden justify-center items-end sm:items-center p-0 sm:p-4">
<div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 relative shadow-2xl">

<button onclick="closeBookModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl w-8 h-8 rounded-full flex items-center justify-center bg-slate-50"><i class="fa-solid fa-xmark"></i></button>

<form id="book-form" onsubmit="saveBook(event)">
<input type="hidden" id="book-id">
<input type="hidden" id="book-isbn">

<!-- Cover & Basic Info -->
<div class="flex gap-4 mb-4 pt-2">
<div class="relative group">
<img id="modal-cover" src="https://via.placeholder.com/128x192?text=Copertina" class="w-24 h-36 object-cover rounded-lg shadow-sm border bg-slate-100">
</div>
<div class="flex-1 flex flex-col justify-between">
<div>
<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Titolo *</label>
<input type="text" id="modal-title" placeholder="Titolo del libro" required class="w-full text-sm font-semibold border-b border-slate-200 pb-1 mb-2 focus:outline-none focus:border-indigo-600 transition">

<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Autore *</label>
<input type="text" id="modal-author" placeholder="Autore/i" required class="w-full text-xs text-slate-700 border-b border-slate-200 pb-1 mb-2 focus:outline-none focus:border-indigo-600 transition">
</div>

<div class="grid grid-cols-2 gap-2">
<div>
<label class="block text-[9px] font-bold text-slate-400 uppercase">Genere</label>
<input type="text" id="modal-genre" placeholder="Es. Romanzo" class="w-full text-xs border-b border-slate-200 pb-1 focus:outline-none focus:border-indigo-600">
</div>
<div>
<label class="block text-[9px] font-bold text-slate-400 uppercase">Anno</label>
<input type="text" id="modal-year" placeholder="Es. 2021" class="w-full text-xs border-b border-slate-200 pb-1 focus:outline-none focus:border-indigo-600">
</div>
</div>
</div>
</div>

<!-- Cover URL -->
<div class="mb-4">
<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">URL Immagine Copertina</label>
<input type="url" id="modal-cover-url" placeholder="https://..." class="w-full text-xs border rounded-lg p-2 text-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-600" onchange="document.getElementById('modal-cover').src=this.value || 'https://via.placeholder.com/128x192?text=Copertina'">
</div>

<!-- Status Picker -->
<div class="mb-4">
<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Stato di Lettura</label>
<select id="modal-status" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-600">
<option value="Da Leggere">📚 Da Leggere</option>
<option value="In Lettura">📖 In Lettura</option>
<option value="Letto">✅ Letto</option>
</select>
</div>

<!-- Rating Stars -->
<div class="mb-4">
<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Valutazione Personale</label>
<select id="modal-rating" class="w-full text-xs border rounded-lg p-2.5 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-600">
<option value="0">Senza Valutazione</option>
<option value="1">⭐ (1/5) - Pessimo</option>
<option value="2">⭐⭐ (2/5) - Mediocre</option>
<option value="3">⭐⭐⭐ (3/5) - Buono</option>
<option value="4">⭐⭐⭐⭐ (4/5) - Molto Buono</option>
<option value="5">⭐⭐⭐⭐⭐ (5/5) - Capolavoro</option>
</select>
</div>

<!-- Review / Notes -->
<div class="mb-5">
<label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Note & Recensione</label>
<textarea id="modal-review" rows="3" class="w-full text-xs border rounded-lg p-2.5 focus:outline-none focus:ring-1 focus:ring-indigo-600 text-slate-700" placeholder="Inserisci le tue note di lettura o una recensione..."></textarea>
</div>

<!-- Actions -->
<div class="flex gap-2 pt-2 border-t">
<button type="submit" class="flex-1 bg-indigo-600 text-white text-xs font-semibold py-3 rounded-xl hover:bg-indigo-700 transition shadow-sm active:scale-95">Salva Libro</button>
<button type="button" id="delete-btn" onclick="deleteBook()" class="bg-red-50 text-red-600 px-4 rounded-xl hover:bg-red-100 text-xs font-semibold hidden transition"><i class="fa-solid fa-trash"></i></button>
</div>
</form>
</div>
</div>

<!-- LOADER NOTIFICATION -->
<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 hidden transition-all flex items-center gap-2">
<i id="toast-icon" class="fa-solid fa-spinner animate-spin"></i>
<span id="toast-msg">Caricamento...</span>
</div>

<script>
// --- 1. INIZIALIZZAZIONE DATABASE LOCALE (Dexie.js) ---
const db = new Dexie('LibreriaDB');
db.version(1).stores({
books: '++id, isbn, title, author, genre, status, rating, created_at'
});

let html5QrcodeScanner = null;
let currentFilter = 'all';
let searchTimeout = null;

// --- 2. GESTIONE TOAST/NOTIFICHE ---
function showToast(message, iconClass = 'fa-spinner animate-spin', duration = 3000) {
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toast-msg');
const toastIcon = document.getElementById('toast-icon');

toastMsg.textContent = message;
toastIcon.className = 'fa-solid ' + iconClass;
toast.classList.remove('hidden');

if (duration > 0) {
setTimeout(() => {
toast.classList.add('hidden');
}, duration);
}
}

function hideToast() {
document.getElementById('toast').classList.add('hidden');
}

// --- 3. RENDERING CATOLOGO ---
async function loadBooks() {
const grid = document.getElementById('books-grid');
const emptyState = document.getElementById('empty-state');
const statsCounter = document.getElementById('stats-counter');
const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

grid.innerHTML = '';

let collection = db.books;

// Filtro Stato
if (currentFilter !== 'all') {
collection = collection.where('status').equals(currentFilter);
}

let books = await collection.toArray();

// Filtro Ricerca Testuale
if (searchQuery) {
books = books.filter(b =>
(b.title && b.title.toLowerCase().includes(searchQuery)) ||
(b.author && b.author.toLowerCase().includes(searchQuery)) ||
(b.genre && b.genre.toLowerCase().includes(searchQuery))
);
}

// Conteggio Totale
const totalCount = await db.books.count();
statsCounter.textContent = ${totalCount} ${totalCount === 1 ? 'libro in catalogo' : 'libri in catalogo'};

if (books.length === 0) {
emptyState.classList.remove('hidden');
return;
}
emptyState.classList.add('hidden');

// Ordina per ultimo aggiunto (id decrescente)
books.reverse().forEach(book => {
const stars = book.rating > 0 ? '⭐'.repeat(book.rating) : '';

let statusBadgeClass = 'bg-slate-100 text-slate-600';
if (book.status === 'In Lettura') statusBadgeClass = 'bg-amber-50 text-amber-600 border border-amber-200';
if (book.status === 'Letto') statusBadgeClass = 'bg-emerald-50 text-emerald-600 border border-emerald-200';
if (book.status === 'Da Leggere') statusBadgeClass = 'bg-indigo-50 text-indigo-600 border border-indigo-200';

const card = document.createElement('div');
card.className = 'bg-white rounded-xl shadow-xs border border-slate-100 overflow-hidden cursor-pointer flex flex-col justify-between hover:shadow-md transition active:scale-[0.98] group';
card.onclick = () => openEditModal(book.id);

card.innerHTML = &lt;div&gt; &lt;div class="relative w-full h-40 bg-slate-100 overflow-hidden"&gt; &lt;img src="${book.coverUrl || 'https://via.placeholder.com/128x192?text=No+Cover'}"
onerror="this.src='https://via.placeholder.com/128x192?text=No+Cover'"
class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
<span class="absolute top-2 left-2 text-[9px] font-bold tracking-wide px-1.5 py-0.5 rounded-md shadow-xs ${statusBadgeClass}"&gt; ${book.status}
</span>
</div>
<div class="p-2.5">
<h3 class="font-semibold text-xs text-slate-800 line-clamp-1 leading-snug">${book.title}&lt;/h3&gt; &lt;p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5"&gt;${book.author || 'Autore sconosciuto'}</p>
</div>
</div>
<div class="p-2.5 pt-0 text-[10px] text-amber-500 font-medium">
${stars ? stars : '&lt;span class="text-slate-300 font-normal"&gt;Nessuna stella&lt;/span&gt;'} &lt;/div&gt;;
grid.appendChild(card);
});
}

// --- 4. RICERCA E FILTRI ---
function debounceSearch() {
clearTimeout(searchTimeout);
const val = document.getElementById('search-input').value;
document.getElementById('clear-search').classList.toggle('hidden', !val);
searchTimeout = setTimeout(loadBooks, 200);
}

function clearSearch() {
document.getElementById('search-input').value = '';
document.getElementById('clear-search').classList.add('hidden');
loadBooks();
}

function setFilter(filter) {
currentFilter = filter;
document.querySelectorAll('nav button').forEach(btn => {
btn.classList.remove('border-indigo-600', 'text-indigo-600', 'font-semibold');
btn.classList.add('border-transparent', 'text-slate-500');
});

const tabMap = { 'all': 'tab-all', 'Da Leggere': 'tab-to-read', 'In Lettura': 'tab-reading', 'Letto': 'tab-read' };
const activeTab = document.getElementById(tabMap[filter]);
if (activeTab) {
activeTab.classList.add('border-indigo-600', 'text-indigo-600', 'font-semibold');
activeTab.classList.remove('border-transparent', 'text-slate-500');
}

loadBooks();
}

// --- 5. SCANNER & GOOGLE BOOKS API ---
function startScanner() {
document.getElementById('scanner-modal').classList.remove('hidden');
document.getElementById('scanner-modal').classList.add('flex');

html5QrcodeScanner = new Html5Qrcode("reader");
html5QrcodeScanner.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: { width: 240, height: 140 } },
onScanSuccess
).catch(err => {
alert("Impossibile accedere alla fotocamera. Assicurati di aver concesso i permessi.");
stopScanner();
});
}

function stopScanner() {
if (html5QrcodeScanner) {
html5QrcodeScanner.stop().then(() => {
html5QrcodeScanner.clear();
document.getElementById('scanner-modal').classList.add('hidden');
document.getElementById('scanner-modal').classList.remove('flex');
}).catch(() => {
document.getElementById('scanner-modal').classList.add('hidden');
document.getElementById('scanner-modal').classList.remove('flex');
});
} else {
document.getElementById('scanner-modal').classList.add('hidden');
document.getElementById('scanner-modal').classList.remove('flex');
}
}

async function onScanSuccess(decodedText) {
stopScanner();
showToast('Ricerca dati libro in corso...');
await fetchBookFromISBN(decodedText);
}

async function fetchBookFromISBN(isbn) {
const cleanIsbn = isbn.replace(/[^0-9X]/gi, '');
try {
const response = await fetch(https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanIsbn}`);
const data = await response.json();

hideToast();

if (data.totalItems > 0) {
const info = data.items[0].volumeInfo;

let coverUrl = '';
if (info.imageLinks) {
coverUrl = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '';
coverUrl = coverUrl.replace('http:', 'https:');
}

openModalWithData({
isbn: cleanIsbn,
title: info.title || '',
author: info.authors ? info.authors.join(', ') : '',
genre: info.categories ? info.categories[0] : '',
year: info.publishedDate ? info.publishedDate.substring(0, 4) : '',
coverUrl: coverUrl,
status: 'Da Leggere',
rating: 0,
review: ''
});
} else {
showToast('Nessun libro trovato. Inserisci i dati manualmente.', 'fa-circle-exclamation text-amber-400', 3000);
openModalWithData({ isbn: cleanIsbn });
}
} catch (err) {
hideToast();
showToast('Errore di connessione al database esterno.', 'fa-wifi text-red-400', 3000);
openModalWithData({ isbn: cleanIsbn });
}
}

// --- 6. GESTIONE MODALE ED EDITING ---
function openModalWithData(book = {}) {
document.getElementById('book-id').value = book.id || '';
document.getElementById('book-isbn').value = book.isbn || '';
document.getElementById('modal-title').value = book.title || '';
document.getElementById('modal-author').value = book.author || '';
document.getElementById('modal-genre').value = book.genre || '';
document.getElementById('modal-year').value = book.year || '';
document.getElementById('modal-cover-url').value = book.coverUrl || '';
document.getElementById('modal-cover').src = book.coverUrl || 'https://via.placeholder.com/128x192?text=Copertina';
document.getElementById('modal-status').value = book.status || 'Da Leggere';
document.getElementById('modal-rating').value = book.rating || 0;
document.getElementById('modal-review').value = book.review || '';

const deleteBtn = document.getElementById('delete-btn');
if (book.id) {
deleteBtn.classList.remove('hidden');
} else {
deleteBtn.classList.add('hidden');
}

document.getElementById('book-modal').classList.remove('hidden');
document.getElementById('book-modal').classList.add('flex');
}

function openManualModal() { openModalWithData(); }
function closeBookModal() {
document.getElementById('book-modal').classList.add('hidden');
document.getElementById('book-modal').classList.remove('flex');
}

async function openEditModal(id) {
const book = await db.books.get(id);
if (book) openModalWithData(book);
}

async function saveBook(e) {
e.preventDefault();
const id = document.getElementById('book-id').value;
const data = {
isbn: document.getElementById('book-isbn').value,
title: document.getElementById('modal-title').value.trim(),
author: document.getElementById('modal-author').value.trim(),
genre: document.getElementById('modal-genre').value.trim(),
year: document.getElementById('modal-year').value.trim(),
coverUrl: document.getElementById('modal-cover-url').value.trim(),
status: document.getElementById('modal-status').value,
rating: parseInt(document.getElementById('modal-rating').value),
review: document.getElementById('modal-review').value.trim(),
updated_at: new Date()
};

if (id) {
await db.books.update(parseInt(id), data);
} else {
data.created_at = new Date();
await db.books.add(data);
}

closeBookModal();
loadBooks();
showToast('Libro salvato con successo!', 'fa-circle-check text-emerald-400', 2000);
}

async function deleteBook() {
const id = document.getElementById('book-id').value;
if (id && confirm('Sei sicuro di voler eliminare questo libro dal tuo catalogo?')) {
await db.books.delete(parseInt(id));
closeBookModal();
loadBooks();
showToast('Libro eliminato.', 'fa-trash text-slate-300', 2000);
}
}

// --- 7. BACKUP IMPORT & EXPORT (JSON) ---
async function exportData() {
const books = await db.books.toArray();
if (books.length === 0) {
alert('Nessun libro da esportare.');
return;
}

const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(books, null, 2));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", libreria_backup_${new Date().toISOString().slice(0,10)}.json`);
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();
}

async function importData(event) {
const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();
reader.onload = async function(e) {
try {
const books = JSON.parse(e.target.result);
if (Array.isArray(books)) {
if (confirm(Vuoi importare ${books.length} libri nel tuo database? I libri duplicati verranno conservati.)) {
for (const book of books) {
delete book.id;
await db.books.add(book);
}
loadBooks();
showToast('Importazione completata!', 'fa-circle-check text-emerald-400', 3000);
}
} else {
alert('File JSON non valido.');
}
} catch (err) {
alert('Errore durante la lettura del file di backup.');
}
};
reader.readAsText(file);
}

// Caricamento Iniziale
loadBooks();
</script>
</body>
</html>
